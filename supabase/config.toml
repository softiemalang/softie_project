[functions.update-push-preferences]
# The handler validates the signed-in scheduler user explicitly.
verify_jwt = false

[functions.register-push-subscription]
# The handler validates the signed-in scheduler user explicitly.
verify_jwt = false

[functions.get-push-preferences]
# The handler validates the signed-in scheduler user explicitly.
verify_jwt = false

[functions.send-test-push]
# The handler validates the signed-in scheduler user explicitly.
verify_jwt = false

[functions.dispatch-scheduler-reminders]
# 스케줄러(Cron)에 의해 자동 호출되므로 JWT 검증을 비활성화해야 401 에러를 방지할 수 있습니다.
verify_jwt = false

[functions.generate-fortune-report]
# The handler performs its own auth/owner checks; public Softie generation is
# restricted to the configured profile, today's snapshot, one idempotent lock,
# and a debug-free response.
verify_jwt = false

[functions.google-oauth-callback]
# Google OAuth redirect does not include a Supabase Authorization header
verify_jwt = false

[functions.google-oauth-start]
# Google OAuth state may only be issued for the authenticated Supabase user.
verify_jwt = true

[functions.google-connection-status]
# Connection status is private to the authenticated Supabase user.
verify_jwt = true

[functions.kakao-oauth-token]
# Kakao OAuth token exchange is called from the public OAuth callback without a Supabase Authorization header.
verify_jwt = false

[functions.spotify-oauth-start]
# Spotify OAuth state is issued only for an authenticated Supabase user.
verify_jwt = false

[functions.spotify-oauth-callback]
# Spotify OAuth redirect does not include a Supabase Authorization header.
verify_jwt = false

[functions.spotify-player-control]
# The handler validates a real Supabase bearer and binds control to that subject.
verify_jwt = false

[functions.google-calendar-create-event]
# Called from the app without Supabase Auth session, using deviceId instead.
verify_jwt = false

[functions.google-drive-backup]
